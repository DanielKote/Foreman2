name: CodeQL Analysis

on:
  push:
    branches-ignore: ['github']
    tags-ignore: ['*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  Windows:
    name: Windows CodeQL Analysis
    if: ${{ !contains(github.event.head_commit.message, '[CI Skip]') }}
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{github.ref}}
          fetch-depth: 0
      - name: Get Tag Version
        id: tag
        uses: actions/github-script@v9
        with:
          script: |
            let ret = '';
            const options = {};
            options.listeners = {
              stdout: (data) => {
                ret += data.toString();
              }
            };
            await exec.exec('git', ['describe'], options);
            return ret.substring(1).split('-')[0]
          result-encoding: string
      - name: Install .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '10.x'
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Restore Dependencies
        run: dotnet restore -r win-x64
      - name: Build Foreman Snapshot
        run: dotnet build Foreman -p:VersionPrefix=${{steps.tag.outputs.result}} -p:VersionSuffix=SNAPSHOT --configuration Release -r win-x64
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

